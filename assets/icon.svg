<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="DSH 系统通知">
  <!-- 极简、居中、全圆角：一个消息气泡 + 三个点 + 一个未读点。不用铃铛、不留锐角。
       气泡与红点各自带一条 45°（对角）渐变，色相只微移，只为质感，不改识别色。 -->
  <defs>
    <linearGradient id="bubbleFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5C7DF6"/>
      <stop offset="1" stop-color="#3D5BE0"/>
    </linearGradient>
    <linearGradient id="badgeFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF757A"/>
      <stop offset="1" stop-color="#E03A45"/>
    </linearGradient>
  </defs>
  <rect x="6" y="14" width="52" height="36" rx="18" fill="url(#bubbleFill)"/>
  <circle cx="22" cy="32" r="4.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="32" cy="32" r="4.5" fill="#FFFFFF"/>
  <circle cx="42" cy="32" r="4.5" fill="#FFFFFF" opacity="0.6"/>
  <!-- 未读点：去掉白色描边，改用自身渐变与底色分离 -->
  <circle cx="49" cy="18" r="7" fill="url(#badgeFill)"/>
</svg>
