name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      # 两个版本线都跑：测试入口曾因 Node 20 与 22+ 对 `node --test` 参数处理不同，
      # 本地（24）全绿却只在 CI（20）挂掉。
      fail-fast: false
      matrix:
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check (every lib/*.js module)
        run: npm run check
      - name: Unit tests (host event flow / focus gate / public API / D-Bus / theme / icons / state)
        run: npm test
      - name: Theme + icon self-check (Linux path; no desktop bus in CI)
        run: node scripts/theme-probe.mjs
      # scripts/dsh-runtime-probe.mjs（把插件挂进 DSH 自带的 cordis 跑契约自检）故意不在这里跑：
      # 它需要一份 deepseek-harness 源码 checkout + tsx，runner 上没有。升级 DSH 后请在本地跑它。
      - name: Validate package.json
        run: node -e "const p=require('./package.json'); if(p.name!=='dsh-desktop-notify') throw new Error('bad name'); if(!p.dsh||!p.dsh.bundle||!p.dsh.client) throw new Error('missing dsh manifest'); if(p.dsh.client.platform!=='web') throw new Error('client platform must be web')"
